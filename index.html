<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#0a68ff">
<meta http-equiv="Cache-Control" content="no-cache">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Fahrtenbuch">
<meta name="mobile-web-app-capable" content="yes">
<style>html{color-scheme:light dark}body{margin:0}img{max-width:100%}[hidden]{display:none!important}</style>
<title>Fahrtenbuch Delmenhorst</title>
<style>
  :root{
    --bg:#f2f2f7; --card:#ffffff; --text:#1c1c1e; --muted:#8a8a8e;
    --line:#e5e5ea; --field:#f7f7f9; --blue:#0a68ff; --green:#1eaa50;
    --red:#e0322b; --purple:#5b4bd6; --chip:#eef2f9;
    --shadow:0 1px 3px rgba(0,0,0,.06),0 6px 20px rgba(0,0,0,.05);
  }
  @media (prefers-color-scheme: dark){
    :root:not([data-theme="light"]){
      --bg:#000000; --card:#1c1c1e; --text:#f2f2f7; --muted:#98989f;
      --line:#2c2c2e; --field:#2c2c2e; --blue:#4c9aff; --green:#32d074;
      --red:#ff6961; --purple:#7d6cf0; --chip:#2c2c2e;
      --shadow:0 1px 3px rgba(0,0,0,.5);
    }
  }
  :root[data-theme="dark"]{
    --bg:#000000; --card:#1c1c1e; --text:#f2f2f7; --muted:#98989f;
    --line:#2c2c2e; --field:#2c2c2e; --blue:#4c9aff; --green:#32d074;
    --red:#ff6961; --purple:#7d6cf0; --chip:#2c2c2e;
    --shadow:0 1px 3px rgba(0,0,0,.5);
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  body{
    margin:0 auto;padding:14px 14px 60px;background:var(--bg);color:var(--text);
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Noto Sans KR",sans-serif;
    font-size:15px;line-height:1.45;max-width:680px;
  }
  header{display:flex;align-items:center;justify-content:space-between;gap:10px;margin:2px 0 12px}
  .htitle{flex:1;min-width:0}
  h1{font-size:19px;font-weight:700;margin:0;letter-spacing:-.3px;white-space:nowrap}
  .sub{font-size:12px;color:var(--muted);margin:1px 0 0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  @media (max-width:380px){ h1{font-size:17px} .sub{font-size:11px} }
  .hbtns{display:flex;gap:6px;flex:0 0 auto}
  .icon-btn{background:var(--card);border:1px solid var(--line);color:var(--text);
    border-radius:10px;padding:8px 10px;font-size:13px;font-weight:600;cursor:pointer;white-space:nowrap}
  .lang{display:flex;background:var(--chip);border-radius:10px;padding:2px;flex:0 0 auto}
  .lang button{border:none;background:transparent;color:var(--muted);font-weight:700;font-size:12px;
    padding:6px 10px;border-radius:8px;cursor:pointer;letter-spacing:.3px}
  .lang button.on{background:var(--card);color:var(--text);box-shadow:0 1px 2px rgba(0,0,0,.15)}
  .stats{display:grid;grid-template-columns:1fr 1fr 1fr;gap:9px;margin-bottom:14px}
  .stat{background:var(--card);border-radius:14px;padding:12px 8px;text-align:center;box-shadow:var(--shadow)}
  .stat .t{font-size:11px;color:var(--muted);font-weight:600}
  .stat .v{font-size:21px;font-weight:800;margin-top:3px;letter-spacing:-.5px;font-variant-numeric:tabular-nums}
  .stat .u{font-size:11px;font-weight:600;color:var(--muted);margin-left:1px}
  .c-blue{color:var(--blue)} .c-green{color:var(--green)} .c-purple{color:var(--purple)}
  .card{background:var(--card);border-radius:16px;padding:14px;margin-bottom:14px;box-shadow:var(--shadow)}
  label{display:block;font-size:12px;font-weight:700;color:var(--muted);margin:0 0 5px}
  select,input,textarea{width:100%;padding:11px 12px;font-size:15px;color:var(--text);
    background:var(--field);border:1px solid var(--line);border-radius:11px;font-family:inherit}
  select{appearance:none;background-image:linear-gradient(45deg,transparent 50%,var(--muted) 50%),linear-gradient(135deg,var(--muted) 50%,transparent 50%);
    background-position:calc(100% - 17px) 50%,calc(100% - 12px) 50%;background-size:5px 5px,5px 5px;background-repeat:no-repeat;padding-right:34px}
  input[type=number]{-moz-appearance:textfield}
  :focus-visible{outline:2px solid var(--blue);outline-offset:2px}
  .row{display:flex;gap:9px;align-items:flex-end}
  .row>div{flex:1;min-width:0}
  .mb{margin-bottom:11px}
  .swap{flex:0 0 auto;background:var(--chip);border:none;color:var(--blue);font-size:17px;
    border-radius:11px;width:44px;height:43px;cursor:pointer;font-weight:700}
  button.b{border:none;border-radius:12px;padding:13px;font-size:15px;font-weight:700;color:#fff;cursor:pointer;width:100%}
  button.b:active{opacity:.75}
  .b-blue{background:var(--blue)} .b-green{background:var(--green)}
  .b-red{background:var(--red)} .b-purple{background:var(--purple)}
  button.b-ghost{background:var(--chip);color:var(--text)}
  .grid2{display:grid;grid-template-columns:1fr 1fr;gap:9px}
  #routeBox{margin:2px 0 13px}
  .chips{display:flex;flex-wrap:wrap;gap:7px}
  .chip{display:inline-flex;align-items:center;gap:6px;max-width:100%;background:var(--chip);
    border:1px solid var(--line);border-radius:999px;padding:8px 12px;font-size:12.5px;
    font-weight:600;color:var(--text);cursor:pointer;line-height:1.2}
  .chip .r{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .chip .km{flex:0 0 auto;color:var(--blue);font-weight:800}
  .chip:active{opacity:.7}
  .kmhint{font-size:11px;color:var(--blue);font-weight:600;margin:-7px 2px 0;padding-bottom:2px}
  .savePlace{margin-top:7px;background:var(--chip);border:none;border-radius:9px;padding:8px 12px;
    color:var(--blue);font-size:12px;font-weight:700;cursor:pointer;width:100%}
  .rtb{display:inline-block;background:var(--chip);color:var(--blue);border-radius:5px;
    padding:1px 5px;font-size:10px;font-weight:800;margin-left:5px;vertical-align:1px}
  .maplink{margin-bottom:2px;font-size:14px;padding:11px}
  .maplink.off{opacity:.45;pointer-events:none}

  .seg{display:flex;background:var(--chip);border-radius:11px;padding:3px;margin-bottom:13px}
  .seg button{flex:1;border:none;background:transparent;color:var(--muted);font-weight:700;
    font-size:13px;padding:8px;border-radius:9px;cursor:pointer}
  .seg button.on{background:var(--card);color:var(--text);box-shadow:0 1px 3px rgba(0,0,0,.12)}
  .gps-box{background:var(--field);border-radius:12px;padding:14px;text-align:center;margin-bottom:11px}
  .gps-live{font-size:32px;font-weight:800;letter-spacing:-1px;line-height:1.1;font-variant-numeric:tabular-nums}
  .gps-meta{font-size:11.5px;color:var(--muted);margin-top:4px;min-height:16px}
  .dot{display:inline-block;width:7px;height:7px;border-radius:50%;background:var(--red);margin-right:5px;vertical-align:1px}
  .rec .dot{animation:pulse 1.2s infinite}
  @keyframes pulse{0%,100%{opacity:1}50%{opacity:.25}}
  @media (prefers-reduced-motion: reduce){ .rec .dot{animation:none} }
  .note{font-size:11.5px;color:var(--muted);margin:8px 2px 0;line-height:1.5}
  .perm{border:1px solid var(--blue);border-radius:12px;padding:12px 13px;margin-bottom:11px;
    background:color-mix(in srgb,var(--blue) 8%,transparent)}
  .perm .perm-txt b{display:block;font-size:13px;font-weight:700;color:var(--blue);margin-bottom:3px}
  .perm .perm-txt span{display:block;font-size:12px;color:var(--muted);line-height:1.5}
  .perm .perm-btn{margin-top:10px;padding:11px;font-size:14px}
  .perm.ok{border-color:var(--green);background:color-mix(in srgb,var(--green) 9%,transparent)}
  .perm.ok .perm-txt b{color:var(--green);margin-bottom:0}
  .help{margin-top:11px;border:1px solid var(--red);border-radius:12px;padding:12px 13px;
    background:color-mix(in srgb,var(--red) 8%,transparent)}
  .help-t{font-size:13px;font-weight:700;color:var(--red);margin-bottom:6px}
  .help ul{margin:0;padding-left:17px;font-size:12.5px;line-height:1.65}
  .help li+li{margin-top:5px}
  .help b{font-weight:700}
  .help-btns{margin-top:11px}
  .help-btns.solo{grid-template-columns:1fr}
  button.b-outline,a.b-outline{background:var(--card);color:var(--text);border:1px solid var(--line)}
  a.b{display:flex;align-items:center;justify-content:center;text-decoration:none;box-sizing:border-box}
  .urlbox{margin-top:9px;background:var(--card);border:1px solid var(--line);border-radius:10px;padding:9px 10px}
  .urlbox code{font-size:10px;line-height:1.5;color:var(--muted);word-break:break-all;
    font-family:ui-monospace,SFMono-Regular,Menlo,monospace;user-select:all;-webkit-user-select:all}
  .help .b{padding:11px;font-size:14px}
  .diag{margin-top:11px;border-top:1px solid var(--line);padding-top:9px}
  .diag-t{font-size:10.5px;font-weight:700;color:var(--muted);letter-spacing:.4px;
    text-transform:uppercase;cursor:pointer;list-style:none}
  .diag-t::-webkit-details-marker{display:none}
  .diag-t::before{content:"▸ ";font-size:9px}
  details[open] .diag-t::before{content:"▾ "}
  .diag code{display:block;font-size:10.5px;line-height:1.6;color:var(--muted);margin-top:4px;
    white-space:pre-wrap;word-break:break-word;font-family:ui-monospace,SFMono-Regular,Menlo,monospace}
  .diag-copy{margin-top:7px;background:var(--chip);color:var(--text);border:none;border-radius:9px;
    padding:7px 11px;font-size:11.5px;font-weight:700;cursor:pointer}
  .list-head{display:flex;justify-content:space-between;align-items:center;margin:0 2px 8px;gap:8px}
  .list-head h2{font-size:15px;margin:0;font-weight:700}
  .list-head select{width:auto;padding:7px 30px 7px 10px;font-size:13px;font-weight:600;background-color:var(--card)}
  .trip{background:var(--card);border-radius:14px;padding:11px 13px;margin-bottom:8px;
    display:flex;align-items:center;gap:11px;box-shadow:var(--shadow)}
  .trip .d{flex:0 0 44px;text-align:center}
  .trip .d .dd{font-size:16px;font-weight:800;line-height:1;font-variant-numeric:tabular-nums}
  .trip .d .mm{font-size:10px;color:var(--muted);font-weight:600}
  .trip .r{flex:1;min-width:0;cursor:pointer}
  .trip .r .p{font-size:13.5px;font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .trip .r .p .arr{color:var(--muted);margin:0 4px}
  .trip .r .z{font-size:11.5px;color:var(--muted);margin-top:1px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .trip .k{flex:0 0 auto;text-align:right;cursor:pointer}
  .trip .k .big{font-size:16px;font-weight:800;color:var(--blue);font-variant-numeric:tabular-nums}
  .trip .k .raw{font-size:10.5px;color:var(--muted)}
  .trip .x{flex:0 0 auto;background:none;border:none;color:var(--muted);font-size:17px;cursor:pointer;padding:2px 2px 2px 4px}
  .empty{text-align:center;color:var(--muted);font-size:13px;padding:26px 10px}
  .month-total{display:flex;justify-content:space-between;align-items:center;background:var(--chip);
    border-radius:12px;padding:11px 14px;font-size:13.5px;font-weight:700;margin-bottom:10px;gap:10px}
  .month-total b{font-size:17px;color:var(--blue);white-space:nowrap;font-variant-numeric:tabular-nums}
  .sheet{position:fixed;inset:0;background:rgba(0,0,0,.45);display:none;align-items:flex-end;
    justify-content:center;z-index:50}
  .sheet.open{display:flex}
  .sheet-in{background:var(--card);width:100%;max-width:680px;border-radius:20px 20px 0 0;
    padding:16px 14px calc(20px + env(safe-area-inset-bottom));max-height:88vh;overflow-y:auto}
  .sheet-in h3{margin:0 0 12px;font-size:16px}
  .sch{padding:10px 2px;border-bottom:1px solid var(--line);font-size:14px}
  .sch .nm{font-weight:600;line-height:1.3;word-break:break-word}
  .sch .pin{margin-right:4px}
  .sch .acts{display:flex;gap:6px;margin-top:6px;flex-wrap:wrap}
  .sch button{background:var(--chip);border:none;border-radius:8px;padding:6px 10px;
    color:var(--text);font-size:11.5px;font-weight:700;cursor:pointer}
  .sch .del{color:var(--red)}
  .sch .addr.has{color:var(--green)}
  .toast{position:fixed;left:50%;transform:translateX(-50%);bottom:24px;background:#111;color:#fff;
    padding:11px 18px;border-radius:22px;font-size:13.5px;font-weight:600;z-index:99;opacity:0;
    transition:opacity .25s;pointer-events:none;max-width:90%;text-align:center}
  .toast.on{opacity:.95}
  .foot{display:grid;grid-template-columns:1fr 1fr;gap:9px;margin-top:14px}
  .tiny{font-size:11px;color:var(--muted);text-align:center;margin-top:16px;line-height:1.6}
  .verbox{text-align:center;margin-top:12px}
  .verbox span{display:inline-block;background:var(--chip);color:var(--text);border-radius:999px;
    padding:7px 14px;font-size:12px;font-weight:700;letter-spacing:.3px;
    font-family:ui-monospace,SFMono-Regular,Menlo,monospace}
</style>
</head>
<body>


<header>
  <div class="htitle">
    <h1>Fahrtenbuch</h1>
    <p class="sub" data-i18n="app.sub"></p>
  </div>
  <div class="hbtns">
    <div class="lang">
      <button id="langKo" onclick="setLang('ko')">KO</button>
      <button id="langDe" onclick="setLang('de')">DE</button>
    </div>
    <button class="icon-btn" data-i18n="nav.schools" onclick="openSchools()"></button>
  </div>
</header>

<div class="stats">
  <div class="stat"><div class="t" data-i18n="stat.week"></div><div class="v c-green"><span id="stWeek">0</span><span class="u">km</span></div></div>
  <div class="stat"><div class="t" data-i18n="stat.month"></div><div class="v c-blue"><span id="stMonth">0</span><span class="u">km</span></div></div>
  <div class="stat"><div class="t" data-i18n="stat.count"></div><div class="v c-purple"><span id="stCount">0</span><span class="u" data-i18n="unit.trips"></span></div></div>
</div>

<div class="card">
  <div class="seg">
    <button id="tabGps" class="on" data-i18n="tab.gps" onclick="setMode('gps')"></button>
    <button id="tabMan" data-i18n="tab.man" onclick="setMode('man')"></button>
  </div>

  <div class="help" id="gpsHelp" hidden>
    <div class="help-t" data-i18n="help.title"></div>
    <ul id="helpSteps"></ul>
    <div class="grid2 help-btns" id="helpBtns">
    <button class="b b-blue" id="btnCopyLink" data-i18n="btn.copylink" onclick="copyLink()" hidden></button>
    <button class="b b-blue" id="btnRetry" data-i18n="btn.retry" onclick="requestPerm()"></button>
    <a class="b b-outline" id="btnNewTab" data-i18n="btn.newtab" target="_blank" rel="noopener"></a>
    </div>
    <div class="urlbox" id="urlBox" hidden>
      <code id="urlText"></code>
    </div>
    <details class="diag">
      <summary class="diag-t" data-i18n="help.diag"></summary>
      <code id="diagText"></code>
      <button class="diag-copy" data-i18n="btn.copy" onclick="copyDiag()"></button>
    </details>
  </div>


  <div class="row mb">
    <div>
      <label data-i18n="f.from"></label>
      <select id="fromSel"></select>
    </div>
    <button class="swap" data-i18n-title="f.swap" onclick="swapSchools()">⇅</button>
    <div>
      <label data-i18n="f.to"></label>
      <select id="toSel"></select>
    </div>
  </div>

  <div id="fromOtherWrap" class="mb" hidden>
    <label data-i18n="f.fromOther"></label>
    <input id="fromOther" data-i18n-ph="ph.place" oninput="applyRouteHint();updatePlaceBtns()">
    <button type="button" class="savePlace" id="savePlaceFrom" data-i18n="btn.savePlace" onclick="savePlace('from')" hidden></button>
  </div>
  <div id="toOtherWrap" class="mb" hidden>
    <label data-i18n="f.toOther"></label>
    <input id="toOther" data-i18n-ph="ph.place" oninput="applyRouteHint();updatePlaceBtns()">
    <button type="button" class="savePlace" id="savePlaceTo" data-i18n="btn.savePlace" onclick="savePlace('to')" hidden></button>
  </div>

  <div id="gpsPane">
    <div class="perm" id="permBox" hidden>
      <div class="perm-txt">
        <b data-i18n="perm.title"></b>
        <span data-i18n="perm.desc"></span>
      </div>
      <button class="b b-blue perm-btn" id="permBtn" data-i18n="btn.allow" onclick="requestPerm()"></button>
    </div>
    <div class="perm ok" id="permOk" hidden>
      <div class="perm-txt"><b data-i18n="perm.ok"></b></div>
    </div>
    <div class="gps-box" id="gpsBox">
      <div class="gps-live"><span id="gpsKm">0.0</span><span class="u" style="font-size:15px"> km</span></div>
      <div class="gps-meta" id="gpsMeta"></div>
    </div>
    <div class="grid2">
      <button class="b b-green" id="btnStart" data-i18n="btn.start" onclick="gpsStart()"></button>
      <button class="b b-red" id="btnStop" data-i18n="btn.stop" onclick="gpsStop()" disabled style="opacity:.4"></button>
    </div>
    <p class="note" data-i18n="gps.note"></p>
  </div>

  <div id="routeBox" hidden>
    <label data-i18n="route.title"></label>
    <div class="chips" id="routeChips"></div>
  </div>

  <div class="row mb" style="margin-top:12px">
    <div>
      <label data-i18n="f.rawKm"></label>
      <input type="number" id="rawKm" step="0.1" min="0" inputmode="decimal" data-i18n-ph="ph.rawKm" oninput="onKmInput()">
      <div class="kmhint" id="kmHint" hidden></div>
    </div>
    <div>
      <label data-i18n="f.payKm"></label>
      <input type="number" id="payKm" step="1" min="0" inputmode="numeric" placeholder="0">
    </div>
  </div>

  <a class="b b-outline maplink" id="mapLink" data-i18n="btn.map" target="_blank" rel="noopener"></a>
  <p class="note" id="mapHint"></p>

  <div class="row mb" style="margin-top:12px">
    <div>
      <label data-i18n="f.date"></label>
      <input type="date" id="dateIn">
    </div>
    <div>
      <label data-i18n="f.purpose"></label>
      <input id="purpose" data-i18n-ph="ph.purpose">
    </div>
  </div>

  <button class="b b-blue" id="saveBtn" data-i18n="btn.save" onclick="saveTrip()"></button>
  <div class="grid2" style="margin-top:9px">
    <button class="b b-ghost" data-i18n="btn.saveReturn" onclick="saveTrip(true)"></button>
    <button class="b b-ghost" data-i18n="btn.reset" onclick="resetForm()"></button>
  </div>
</div>

<div class="list-head">
  <h2 data-i18n="list.title"></h2>
  <select id="monthSel" onchange="render()"></select>
</div>
<div class="month-total"><span id="mtLabel"></span><b><span id="mtValue">0</span> km</b></div>
<div id="tripList"></div>

<div class="foot">
  <button class="b b-purple" data-i18n="btn.csv" onclick="exportCSV()"></button>
  <button class="b b-ghost" data-i18n="btn.backup" onclick="backup()"></button>
</div>
<div class="foot" style="margin-top:9px">
  <button class="b b-ghost" data-i18n="btn.restore" onclick="document.getElementById('restoreFile').click()"></button>
  <button class="b b-ghost" data-i18n="btn.wipe" onclick="wipe()"></button>
</div>
<input type="file" id="restoreFile" accept=".json,application/json" style="display:none" onchange="restore(event)">

<p class="tiny" id="footNote"></p>
<div class="verbox"><span id="verLine"></span></div>

<div class="sheet" id="schoolSheet" onclick="if(event.target===this)closeSchools()">
  <div class="sheet-in">
    <h3 data-i18n="sheet.title"></h3>
    <div class="row mb">
      <div><input id="newSchool" data-i18n-ph="ph.newSchool"></div>
      <button class="swap" style="width:52px" onclick="addSchool()">＋</button>
    </div>
    <div id="schoolList"></div>
    <button class="b b-ghost" style="margin-top:14px" data-i18n="btn.close" onclick="closeSchools()"></button>
  </div>
</div>

<div class="toast" id="toast"></div>

<script>
(function(){
"use strict";

var APP_VER="2026-09-06a";
var K_REC="dh_fb_records_v2", K_SCH="dh_fb_schools_v1", K_LANG="dh_fb_lang", K_OLD="dh_fahrtenbuch_data";
var OTHER="__other__";

/* ================= i18n ================= */
var STR={
ko:{
 "app.sub":"Delmenhorst 학교 순회 기록",
 "nav.schools":"학교 관리",
 "stat.week":"이번 주","stat.month":"이번 달","stat.count":"이번 달 건수","unit.trips":"회",

function load(){
  var sl=null; try{ sl=localStorage.getItem(K_LANG); }catch(e){}
  if(sl==="ko"||sl==="de") lang=sl;
  else lang=(navigator.language||"").toLowerCase().indexOf("ko")===0?"ko":"de";

  schools=lsGet(K_SCH,null);
  if(!schools||!schools.length){ schools=DEFAULT_SCHOOLS.slice(); lsSet(K_SCH,schools); }
  else{
    schools.forEach(function(s){ if(OLD_G[s.g]) s.g=OLD_G[s.g]; if(GROUPS.indexOf(s.g)<0) s.g="custom"; });
    /* bring addresses / coordinates of the built-in places into an older stored list,
       and add built-in places the stored list does not have yet */
    var have={};
    schools.forEach(function(s){ have[s.k||s.n]=s; });
    DEFAULT_SCHOOLS.forEach(function(d){
      var cur=have[d.k||d.n];
      if(!cur){ schools.push(d); return; }
      if(!cur.a&&d.a) cur.a=d.a;
      if(!cur.c&&d.c) cur.c=d.c;
    });
    /* Lessingschule is the former name of the Mosaikschule — same building, drop the duplicate */
    var mig=null; try{ mig=localStorage.getItem("dh_fb_mig1"); }catch(e){}
    if(!mig){
      schools=schools.filter(function(s){ return s.n!=="Lessingschule"; });
      try{ localStorage.setItem("dh_fb_mig1","1"); }catch(e){}
    }
    lsSet(K_SCH,schools);
  }

  records=lsGet(K_REC,null);
  if(!records){
    records=[];
    var old=lsGet(K_OLD,[]);
    if(old&&old.length){
      old.forEach(function(o){
        var d=new Date(o.timestamp||Date.now());
        records.push({id:uid(),ts:o.timestamp||0,date:iso(d),from:o.from||"",to:o.to||"",purpose:"",
          rawKm:Number(o.rawKm)||0,payKm:Number(o.roundedKm)||0,gps:false});
      });
      lsSet(K_REC,records);
      setTimeout(function(){ toast(t("t.imported",old.length)); },400);
    }
  }
}

var gps={active:false,id:null,dist:0,last:null,t0:0,wake:null,tick:null,acc:null,autoFrom:false,here:null,hereName:""};
function hav(a,b,c,d){
  var R=6371,r=Math.PI/180;
  var dLa=(c-a)*r,dLo=(d-b)*r;
  var x=Math.sin(dLa/2)*Math.sin(dLa/2)+Math.cos(a*r)*Math.cos(c*r)*Math.sin(dLo/2)*Math.sin(dLo/2);
  return 2*R*Math.asin(Math.min(1,Math.sqrt(x)));
}
/* ---- which known place is the phone standing at? ---- */
function nearestPlace(la,lo,maxKm){
  var lim=maxKm||0.35, hits=[];
  schools.forEach(function(s0){
    if(!s0.c) return;
    var d=hav(la,lo,s0.c[0],s0.c[1]);
    if(d<lim) hits.push({s:s0,km:d});
  });
  if(!hits.length) return null;
  hits.sort(function(a,b){ return a.km-b.km; });
  var alt=hits.filter(function(h,i){ return i>0 && h.km-hits[0].km<0.1; })
              .map(function(h){ return pname(h.s); });
  return {s:hits[0].s,km:hits[0].km,alt:alt};
}
var pendingLoc={from:null,to:null};
/* turn raw coordinates into something a Fahrtenbuch can show.
   OpenStreetMap lookup when online, coordinates when not. */
function reverseGeo(la,lo){
  if(!window.fetch) return Promise.resolve(null);
  var u="https://nominatim.openstreetmap.org/reverse?format=jsonv2&zoom=18&addressdetails=1"+
        "&accept-language=de&lat="+la+"&lon="+lo;
  var ctl=null, timer=null;
  try{ ctl=new AbortController(); timer=setTimeout(function(){ ctl.abort(); },8000); }catch(e){}
  return fetch(u,ctl?{signal:ctl.signal}:{}).then(function(r){ return r.ok?r.json():null; })
    .then(function(j){
      if(timer) clearTimeout(timer);
      if(!j) return null;
      var a=j.address||{};
      var road=a.road||a.pedestrian||a.footway||a.residential||"";
      var nr=a.house_number?(" "+a.house_number):"";
      var city=a.city||a.town||a.village||a.municipality||"";
      var nm=j.name||a.amenity||a.shop||a.office||"";
      var parts=[];
      if(nm&&nm!==road) parts.push(nm);
      if(road) parts.push(road+nr);
      if(city&&parts.join(", ").indexOf(city)<0) parts.push(city);
      var out=parts.join(", ").trim();
      return out||null;
    })
    .catch(function(){ if(timer) clearTimeout(timer); return null; });
}

function onPos(p){
  var la=p.coords.latitude, lo=p.coords.longitude, ac=p.coords.accuracy;
  gps.acc=ac;
  if(permState!=="granted"){ permState="granted"; renderPermUI(); }
  if(ac>60){ setMeta(); return; }
  gps.here={la:la,lo:lo};
  if(!gps.autoFrom){
    gps.autoFrom=true;
    var np=nearestPlace(la,lo);
    if(np){ gps.hereName=pname(np.s); setPlace("from",gps.hereName); toast(t("t.autoFrom",placeLabel(np))); }
    else{ gps.hereName=""; setUnknownPlace("from",la,lo); }
  }
  if(gps.last){
    var d=hav(gps.last.la,gps.last.lo,la,lo);
    if(d>=0.008&&d<3){ gps.dist+=d; gps.last={la:la,lo:lo}; }
    else if(d>=3){ gps.last={la:la,lo:lo}; }
  }else{ gps.last={la:la,lo:lo}; }
  document.getElementById("gpsKm").textContent=gps.dist.toFixed(1);
  setMeta();
}

function renderPermUI(){
  var box=document.getElementById("permBox"), ok=document.getElementById("permOk");
  if(ENV.file||ENV.insecure||!navigator.geolocation){ box.hidden=true; ok.hidden=true; return; }
  if(permState==="granted"){ box.hidden=true; ok.hidden=false; hideHelp(); return; }
  ok.hidden=true;
  if(permState==="denied"){ box.hidden=true; return; }   /* red help box takes over */
  box.hidden=false;                                       /* "prompt" or unknown */
}
window.requestPerm=function(){
  if(!navigator.geolocation){ toast(t("t.noGeo")); showHelp(false); return; }
  var btn=document.getElementById("permBtn");
  btn.disabled=true; btn.style.opacity=".6"; btn.textContent=t("btn.allowing");
  var done=false;
  var finish=function(){ if(done) return; done=true;
    btn.disabled=false; btn.style.opacity="1"; btn.textContent=t("btn.allow"); };
  navigator.geolocation.getCurrentPosition(function(){
    permState="granted"; finish(); hideHelp(); renderPermUI(); toast(t("t.permOk"));
  },function(e){
    finish();
    if(e&&e.code===1){
      permState="denied"; lastErr={code:1,message:(e&&e.message)||""};
      showHelp(/policy|disabled/i.test((e&&e.message)||""));
    }else{
      lastErr={code:(e&&e.code)||0,message:(e&&e.message)||""};
      toast(t("gps.err"));
    }
    renderPermUI();
  },{enableHighAccuracy:false,timeout:20000,maximumAge:600000});
};
function checkPermission(){
  if(ENV.file||ENV.insecure||!navigator.geolocation){ showHelp(false); renderPermUI(); return; }
  if(!(navigator.permissions&&navigator.permissions.query)){ renderPermUI(); return; }
  try{
    navigator.permissions.query({name:"geolocation"}).then(function(st){
      permState=st.state;
      if(st.state==="denied") showHelp(false); else hideHelp();
      renderPermUI();
      st.onchange=function(){ permState=st.state;
        if(st.state==="denied") showHelp(false); else hideHelp();
        renderPermUI(); };
    },function(){ renderPermUI(); });
  }catch(e){ renderPermUI(); }
}

function onErr(e){
  lastErr={code:(e&&e.code)||0,message:(e&&e.message)||""};
  var denied=e&&e.code===1;
  var policy=denied&&/permission|policy|disabled|blocked/i.test((e&&e.message)||"");
  if(denied){
    permState="denied";
    gpsStop();
    showHelp(policy);
    renderPermUI();
    document.getElementById("gpsMeta").textContent=t("gps.denied");
    return;
  }
  /* code 2/3 are transient (tunnel, no fix yet) — keep measuring, just report */
  if(gps.active) document.getElementById("gpsMeta").textContent=t("gps.err");
  else{ gpsStop(); document.getElementById("gpsMeta").textContent=t("gps.err"); }
}

window.gpsStop=function(){

  gps.active=false; gps.id=null;
  var a=document.getElementById("btnStart"), b=document.getElementById("btnStop");
  a.disabled=false; a.style.opacity="1"; b.disabled=true; b.style.opacity=".4";
  document.getElementById("gpsBox").classList.remove("rec");

    }else if(gps.dist>0.15){

  var km=Math.round(gps.dist*10)/10;
  document.getElementById("gpsMeta").textContent=km>0?t("gps.done",num(km.toFixed(1))):t("gps.none");

/* ---- route memory: derived from the saved trips, so it is always in sync ---- */
function routeMap(){
  var m={};
  records.forEach(function(r){
    if(r.rt) return;
    var k=r.from+"\u0001"+r.to;
    if(!m[k]) m[k]={from:r.from,to:r.to,n:0,km:r.rawKm,pay:r.payKm,ts:r.ts||0};
    var e=m[k]; e.n++;
    if((r.ts||0)>=e.ts){ e.ts=r.ts||0; e.km=r.rawKm; e.pay=r.payKm; }
  });
  return m;
}

function applyRouteHint(){
  var hint=document.getElementById("kmHint");
  var from=val("fromSel","fromOther"), to=val("toSel","toOther");
  var e=(from&&to)?routeMap()[from+"\u0001"+to]:null;
  if(!e||editId){
    hint.hidden=true;
    if(kmAuto&&!editId){
      document.getElementById("rawKm").value="";
      document.getElementById("payKm").value="";

}
function renderRoutes(){
  var box=document.getElementById("routeBox"), wrap=document.getElementById("routeChips");
  var m=routeMap(), list=[];
  for(var k in m) if(Object.prototype.hasOwnProperty.call(m,k)) list.push(m[k]);

      '<span class="km">'+e.pay+' km</span></button>';

window.saveTrip=function(roundTrip){
  var from=val("fromSel","fromOther"), to=val("toSel","toOther");
  var raw=parseFloat(document.getElementById("rawKm").value);
  var payRaw=document.getElementById("payKm").value;
  var pay=payRaw===""?roundPay(raw):Math.round(parseFloat(payRaw));
  var date=document.getElementById("dateIn").value||iso(new Date());
  var purpose=document.getElementById("purpose").value.trim();

  if(!from||!to){ toast(t("t.needPlaces")); return; }
  if(from===to){ toast(t("t.samePlace")); return; }
  if(isNaN(raw)||raw<=0){ toast(t("t.needKm")); return; }
  if(isNaN(pay)||pay<0){ toast(t("t.badPay")); return; }

  var one=Math.round(raw*10)/10;

  if(editId){
    var r=records.filter(function(x){ return x.id===editId; })[0];
    if(r){ r.date=date; r.from=from; r.to=to; r.purpose=purpose;
      r.rawKm=one; r.payKm=pay; }
    editId=null; toast(t("t.updated"));
    save();
  }else if(roundTrip===true){
    /* one leg is `one` km — the RETURN trip is settled on the summed distance,
       so 2.3 + 2.3 = 4.6 becomes 5 km, not 2 + 2 = 4 km */
    var total=Math.round(one*2*10)/10, rtPay=roundPay(total);
    records.push({id:uid(),ts:Date.now(),date:date,from:from,to:to,purpose:purpose,
      rawKm:total,legKm:one,rt:true,payKm:rtPay,gps:mode==="gps"});
    toast(t("t.savedRt",num(one),num(one),num(total),rtPay));
    save();
  }else{
    /* is this the way back of a trip already logged today? */
    var back=records.filter(function(x){
      return !x.rt && x.date===date && x.from===to && x.to===from; })
      .sort(function(a,b){ return (b.ts||0)-(a.ts||0); })[0];
    if(back){
      var sum=Math.round((back.rawKm+one)*10)/10;
      var merged=roundPay(sum), apart=back.payKm+pay;
      if(confirm(t("c.merge",back.from+" → "+back.to+"  ("+num(back.rawKm)+" km)",
                            from+" → "+to+"  ("+num(one)+" km)",
                            num(back.rawKm),num(one),num(sum),merged,apart))){
        back.rt=true; back.legKm=Math.round((sum/2)*10)/10;
        back.rawKm=sum; back.payKm=merged; back.ts=Date.now();
        if(purpose&&!back.purpose) back.purpose=purpose;
        toast(t("t.merged",merged));
        save();
        document.getElementById("monthSel").value=date.slice(0,7);
        resetForm(); render(); applyRouteHint();
        return;
      }
    }
    records.push({id:uid(),ts:Date.now(),date:date,from:from,to:to,purpose:purpose,
      rawKm:one,payKm:pay,gps:mode==="gps"});
    toast(t("t.saved",pay));
    save();
  }
  document.getElementById("monthSel").value=date.slice(0,7);
  resetForm();
  render();
  applyRouteHint();
};
function editTrip(id){

  editId=id;

        '<div class="p">'+esc(r.from)+'<span class="arr">'+(r.rt?"⇄":"→")+'</span>'+esc(r.to)+
          (r.rt?'<span class="rtb">'+esc(t("rt.badge"))+'</span>':"")+'</div>'+

/* ================= export ================= */
var dlCap=null, dlChecked=false;
function capDownloads(){
  if(dlChecked) return Promise.resolve(dlCap);
  if(!(window.claude&&typeof window.claude.use==="function")){ dlChecked=true; return Promise.resolve(null); }
  return window.claude.use("downloads").then(function(d){ dlCap=d; dlChecked=true; return d; },
    function(){ dlChecked=true; return null; });
}
function download(name,text,mime,okMsg){
  var blob=new Blob([text],{type:mime||"text/plain;charset=utf-8"});
  capDownloads().then(function(d){
    if(d&&typeof d.save==="function"){
      d.save({filename:name,data:blob}).then(function(){ toast(okMsg); },
        function(e){ if(e&&e.code==="declined") return;
          toast(t("t.saveFail")+(e&&e.code?" ("+e.code+")":"")); });
      return;
    }
    var url=URL.createObjectURL(blob);
    var a=document.createElement("a");
    a.href=url; a.download=name; a.rel="noopener";
    document.body.appendChild(a); a.click();
    setTimeout(function(){ document.body.removeChild(a); URL.revokeObjectURL(url); },1500);
    toast(okMsg);
  });
}

    var p=r.date.split("-");
    rows.push([p[2]+"."+p[1]+"."+p[0],q(r.from),q(r.to),
      q(r.rt?"Hin- und Rueckfahrt":"einfach"),
      q(r.purpose||""),de(r.rawKm),r.payKm].join(";"));
  });
  rows.push(";;;;"+q("Summe")+";;"+tot);
  download("Fahrtenbuch_Delmenhorst_"+(m==="all"?"gesamt":m)+".csv","﻿"+rows.join("\r\n"),
    "text/csv;charset=utf-8",t("t.csvDone",view.length));
};
window.backup=function(){
  download("Fahrtenbuch_Backup_"+iso(new Date())+".json",
    JSON.stringify({v:2,exported:new Date().toISOString(),schools:schools,records:records},null,2),
    "application/json",t("t.backupDone"));
};
window.restore=function(ev){
  var f=ev.target.files&&ev.target.files[0]; if(!f) return;
  var fr=new FileReader();
  fr.onload=function(){
    try{
      var d=JSON.parse(fr.result);
      var recs=d.records||(Array.isArray(d)?d:null);
      if(!recs) throw 0;
      if(!confirm(t("c.restore",recs.length))){ records=recs; }
      else{
        var have={}; records.forEach(function(r){ have[r.id]=1; });
        recs.forEach(function(r){ if(!r.id) r.id=uid(); if(!have[r.id]) records.push(r); });
      }
      if(d.schools&&d.schools.length){
        schools=d.schools;
        schools.forEach(function(s){ if(OLD_G[s.g]) s.g=OLD_G[s.g]; if(GROUPS.indexOf(s.g)<0) s.g="custom"; });
        lsSet(K_SCH,schools); fillSelects();
      }
      save(); render(); toast(t("t.restored"));
    }catch(e){ toast(t("t.badFile")); }
    ev.target.value="";
  };
  fr.readAsText(f);
};
window.wipe=function(){
  if(!confirm(t("c.wipe1"))) return;
  if(!confirm(t("c.wipe2"))) return;
  records=[]; save(); render(); toast(t("t.wiped"));
};

/* ================= init ================= */
load();
document.getElementById("fromSel").onchange=onSelChange;
document.getElementById("toSel").onchange=onSelChange;
document.getElementById("dateIn").value=iso(new Date());
applyLang();
onSelChange();
checkPermission();
window.addEventListener("beforeunload",function(e){
  if(gps.active){ e.preventDefault(); e.returnValue=""; }
});
document.addEventListener("visibilitychange",function(){
  if(!document.hidden&&!gps.active) checkPermission();
  if(!document.hidden&&gps.active&&gps.wake===null&&navigator.wakeLock&&navigator.wakeLock.request){
    navigator.wakeLock.request("screen").then(function(w){ gps.wake=w; },function(){});
  }
});
})();
</script>
